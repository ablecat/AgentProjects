name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests scripts benchmarks
      - run: mypy src/repo_agent
      - run: python -m pytest --cov=repo_agent --cov-report=term-missing --cov-fail-under=80
      - run: python benchmarks/validate.py --structure-only

  docker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: docker build --pull=false -t repo-agent-python:0.1 docker/python
      - run: docker build --pull=false -t repo-agent-maven:0.1 docker/maven
      - run: python scripts/smoke-day1.py
      - run: python scripts/smoke-day2.py
      - run: python scripts/smoke-day3.py
      - run: python scripts/smoke-day6.py

  windows-process-lifecycle:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: >-
          python -m pytest
          tests/test_processes.py
          tests/test_sandbox.py
          tests/test_repository_map_edges.py
